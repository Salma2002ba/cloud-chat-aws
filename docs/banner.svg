    <path d="M190 90 v40" stroke="#e8a33d"/>
    <rect x="86" y="130" width="28" height="28" rx="6" stroke="#e8397d"/>
    <rect x="131" y="130" width="28" height="28" rx="6" stroke="#29c282"/>
    <rect x="176" y="130" width="28" height="28" rx="6" stroke="#e8a33d"/>
